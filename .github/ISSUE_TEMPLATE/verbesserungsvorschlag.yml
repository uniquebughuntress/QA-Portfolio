name: 💡 Verbesserungsvorschlag
description: Einen Verbesserungsvorschlag für den Grocery Mate WebShop einreichen
title: "[Improvement]: "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 💡 Verbesserungsvorschlag – Grocery Mate WebShop
        Bitte alle Felder vollständig ausfüllen.
        
        **Hinweis:** Verbesserungsvorschläge sind keine Bug-Reports. Sie beschreiben, was besser sein könnte – nicht, was kaputt ist.

  - type: input
    id: title
    attributes:
      label: Titel
      description: Kurze, aussagekräftige Zusammenfassung des Verbesserungsvorschlags
    validations:
      required: true

  - type: input
    id: reporter
    attributes:
      label: Melder
      description: Dein vollständiger Name
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Datum
      description: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Betroffene Bereiche
      description: Welche Seite / welches Feature betrifft der Vorschlag?
      value: |
        - **Anwendung:** Grocery Mate WebShop
        - **Seite / Bereich:** 
        - **Browser:** Chrome 128.0.6613.138 / Firefox 151.0.2 / Brave 1.90.128 (falls relevant)
        - **Betriebssystem:** Windows 11 / macOS 15.4 / Android 16 (falls relevant)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Beschreibung des Verbesserungsvorschlags
      description: Was ist der aktuelle Zustand? Was schlägst du vor?
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Erwarteter Nutzen
      description: Welchen Mehrwert bringt diese Verbesserung für Nutzer oder Shop?
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Konkrete Empfehlung (optional)
      description: Wie könnte die Verbesserung technisch oder visuell umgesetzt werden?

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Anhänge (optional)
      description: Skizzen, Mockups oder Beispiele aus anderen Shops

  - type: markdown
    attributes:
      value: |
        ---
        **Hinweis:** Die Entscheidung über Verbesserungsvorschläge liegt beim Product Owner. Als QA dokumentiere ich die Idee – das Team entscheidet über die Umsetzung.
