name: 🐞 Bug Report
description: Report a bug in Grocery Mate WebShop – JIRA Style
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 🐞 Bug Ticket – Grocery Mate WebShop
        Please fill out all fields completely.

  - type: input
    id: title
    attributes:
      label: Title
      description: Short, meaningful summary of the bug
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - 🔴 Critical (Core functionality broken / Security issue)
        - 🟠 Medium (Feature partially usable / Data protection issue)
        - 🟡 Low (Cosmetic / UX bug)
    validations:
      required: true

  - type: input
    id: reporter
    attributes:
      label: Reporter
      description: Your full name
    validations:
      required: true

  - type: input
    id: testuser
    attributes:
      label: Test User (if applicable)
      description: Email and password
      placeholder: "Email: test1@test.de / password: AdminTest!"

  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Test Environment
      description: Browser, operating system, application
      value: |
        - **Application:** Grocery Mate WebShop
        - **Page:** 
        - **Browser:** Chrome 128.0.6613.138 / Firefox 151.0.2 / Brave 1.90.128
        - **Operating System:** Windows 11 / macOS 15.4 / Android 16
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the problem?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should happen? (according to requirements)
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Result
      description: What actually happens?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Attachments
      description: Drag & drop here

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Root cause, business risk, affected test cases, etc.
